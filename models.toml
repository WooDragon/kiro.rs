# Anthropic-compatible model definitions
# This file is compiled into the binary as defaults and can be customized by users.
#
# Matching algorithm:
# 1. Extract family from incoming model string (opus/sonnet/haiku)
# 2. Iterate models in TOML order
# 3. Match family AND (empty match_version OR any match_version substring found)
# 4. Return first match
#
# Therefore: versioned entries MUST precede fallback entries within same family

[defaults]
context_window = 200_000
min_cacheable_tokens = 1024
max_tokens = 64000

# ============================================================================
# Opus Family (pro tier)
# ============================================================================

