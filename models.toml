# Anthropic-compatible model definitions
# This file is compiled into the binary as defaults and can be customized by users.
#
# Matching algorithm:
# 1. Entries are partitioned: versioned (match_version non-empty) first, then fallbacks (empty).
#    Within each partition, original TOML order is preserved (stable sort).
# 2. Incoming model string is lowercased, then matched against entries in order.
# 3. An entry matches if match_family is found AND any match_version substring is found
#    (or match_version is empty = family-level fallback).
# 4. First match wins.
#
# Consequence: within a family, put more specific versions before general ones.
# Fallback entries (match_version = []) always come after all versioned entries regardless of TOML position.

[defaults]
context_window = 200_000
min_cacheable_tokens = 1024
max_tokens = 64000

