name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for release (e.g., 2026.3.1 or v2026.3.1)'
        required: true
        default: '2026.3.1'

permissions:
  contents: write

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        with:
          fetch-depth: 0
      - name: Check if commit has release tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/* ]] && git tag --points-at HEAD | grep -q '^v'; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping beta release: commit already has a release tag"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            if [[ "$RAW_VERSION" == v* ]]; then
              TAG="$RAW_VERSION"
            else
              TAG="v$RAW_VERSION"
            fi
            VERSION="$TAG"
            RELEASE_NAME="Release $TAG"
            PRERELEASE=false
            MAKE_LATEST=true
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="$TAG"
            RELEASE_NAME="Release $TAG"
            PRERELEASE=false
            MAKE_LATEST=true
          else
            SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
            TAG="beta-$SHORT_SHA"
            VERSION="$TAG"
            RELEASE_NAME="Beta $SHORT_SHA"
            PRERELEASE=true
            MAKE_LATEST=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: linux-x86_64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: linux-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: Install admin-ui dependencies
        working-directory: admin-ui
        run: pnpm install --frozen-lockfile

      - name: Build admin-ui
        working-directory: admin-ui
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-${{ matrix.target }}
          cache-on-failure: true

      - name: Build app
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          PACKAGE_ROOT="dist/kiro-rs-${{ needs.prepare.outputs.version }}-${{ matrix.asset_name }}"
          mkdir -p "$PACKAGE_ROOT"
          cp "target/${{ matrix.target }}/release/kiro-rs" "$PACKAGE_ROOT/"
          cp README.md LICENSE "$PACKAGE_ROOT/"
          tar -C dist -czf "dist/kiro-rs-${{ needs.prepare.outputs.version }}-${{ matrix.asset_name }}.tar.gz" "$(basename "$PACKAGE_ROOT")"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kiro-rs-${{ needs.prepare.outputs.version }}-${{ matrix.asset_name }}
          if-no-files-found: error
          compression-level: 0
          path: dist/*.tar.gz

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: kiro-rs-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ fromJSON(needs.prepare.outputs.prerelease) }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.tar.gz

  cleanup:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the 10 newest releases
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const staleReleases = releases
              .filter((release) => !release.draft)
              .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())
              .slice(10);

            if (staleReleases.length === 0) {
              core.info('No old releases to delete.');
              return;
            }

            for (const release of staleReleases) {
              core.info(`Deleting release ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }
